# What this repo reverses. Originals are never committed; they live in R2 under these keys and every tool
# verifies the sha256 before use.

project = "t6"
title = "Call of Duty: Black Ops II (PC; Microsoft Store x64 target)"
graph = "re_t6"
r2_public = "https://r2.houseofkublai.com/"
ghidra = "12.1.4"
compiler = "Store target: VS2019 16.11 (cl 19.29.30154), x64, LTCG, GDK. Servers and Steam exe: VS2010 (linker 10.00), x86"
# Original source roots, for turning PDB/MAP paths into repo paths (tools/pdb/extract.py).
source_roots = ['c:\t6\code\src', 'e:\t6\pc\dev\code\src_noserver']

# kind: "retail"    = the final target: the Microsoft Store (GDK) build, package 38985CA0.CallofDutyBlackOps2PCMS 1.1.8.0
#                     (docs/store-build.md). x64, no Arxan, no Steam, no relocations (fixed base 0x140000000).
#       "reference" = has symbols (PDB/MAP): the March 2013 PC dedicated servers, x86.
#       "related"   = no symbols but helpful: the 2015 Steam t6mp.exe (x86), already fully analysed. Community
#                     clients (Plutonium T6) name its addresses, which can be carried to the target by matching.
# `analyze = true` puts a build in the next Ghidra pipeline run (.github/workflows/ghidra.yml); a manual run can name
# any builds instead. Set it back to false once analysis/<build>/ is committed.
# `ghidra_pdb = false` analyses a symbol build blind, so its own PDB/MAP can score tools/match (docs/matching.md).

# Final target, multiplayer first. Rebuilt with VS2019 16.11 in d:\workspace\outrun\t6 (the same port as Ghosts' Store build).
[[build]]
id = "t6mp_msstore"
kind = "retail"
architecture = "x64"
image_base = 0x140000000
analyze = false  # analysed (analysis/t6mp_msstore)
