name: Reconstruction checks

# Every push: the reconstruction compiles for every build it is tested on (hybrid-linked DLLs: x86 for the servers
# and the Steam exe, x64 for the Store build), every differential test passes, records/ claims only what the tests
# show, and the generated inventory and STATUS.md are current.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    env:
      T6_ORIGINALS: originals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q clang lld llvm >/dev/null
          clang --version | head -1
          pip install -q -r tests/differential/requirements.txt
      - name: Reconstructed external-DLL source-body tests (not differential yet)
        run: |
          for test in reconstructed_dlls/bink/test_bink_small.cpp reconstructed_dlls/bink/test_bink_leaf.cpp reconstructed_dlls/bink/test_bink_frames.cpp reconstructed_dlls/bink/test_bink_dispatch.cpp reconstructed_dlls/bink/test_header_validation.cpp reconstructed_dlls/bink/test_transform_butterfly8.cpp reconstructed_dlls/bink/test_transform_rotate.cpp reconstructed_dlls/bink/test_bink_keyframe.cpp reconstructed_dlls/bink/test_audio_permute32.cpp reconstructed_dlls/bink/test_video_inverse8x8.cpp reconstructed_dlls/bink/test_video_inverse8x8_2x.cpp reconstructed_dlls/bink/test_video_interleave_bytes.cpp reconstructed_dlls/bink/test_video_predict8x8_core.cpp reconstructed_dlls/bink/test_entropy_bytes.cpp reconstructed_dlls/bink/test_entropy_nibbles.cpp reconstructed_dlls/bink/test_entropy_signed_bytes.cpp reconstructed_dlls/bink/test_entropy_deltas16.cpp reconstructed_dlls/bink/test_entropy_byte_rle.cpp reconstructed_dlls/bink/test_huffman_codebook.cpp reconstructed_dlls/xcurl/test_getinfo_unlocked.cpp reconstructed_dlls/xcurl/test_slist.cpp reconstructed_dlls/xcurl/test_duplicate_string.cpp; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer "$test" -o /tmp/bink_leaf_test
            /tmp/bink_leaf_test
          done
      - name: Emulate pinned original Bink leaf functions (oracle, not differential)
        run: |
          python tools/dlls/fetch.py originals/dlls
          python tests/dlls/oracle_bink.py originals/dlls/binkw64.dll
      - name: Differential Bink frame metadata (Unicorn vs reconstructed C++)
        run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/bink/bink_frames.cpp -o build/bink_frames_test.so
          python tests/dlls/differential_frames.py originals/dlls/binkw64.dll build/bink_frames_test.so
      - name: Differential Bink codec SSE butterfly (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -fno-fast-math -ffp-contract=off \
            -Wall -Wextra -Werror reconstructed_dlls/bink/transform_butterfly8.cpp -o build/bink_transform_test.so
          python tests/dlls/differential_butterfly.py originals/dlls/binkw64.dll build/bink_transform_test.so
      - name: Differential Bink 16-float transform (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -fno-fast-math -ffp-contract=off \
            -Wall -Wextra -Werror reconstructed_dlls/bink/transform_butterfly16.cpp -o build/bink_transform16_test.so
          python tests/dlls/differential_butterfly16.py originals/dlls/binkw64.dll build/bink_transform16_test.so
      - name: Differential chained original Bink codebook and byte entropy decoding
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/huffman_codebook.cpp \
            reconstructed_dlls/bink/entropy_bytes.cpp -o build/bink_codebook_chained.so
          python tests/dlls/differential_codebook_to_entropy.py originals/dlls/binkw64.dll build/bink_codebook_chained.so
      - name: Differential original Bink Huffman codebook type and symbol permutations
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/huffman_codebook.cpp -o build/bink_huffman_codebook.so
          python tests/dlls/differential_huffman_codebook.py originals/dlls/binkw64.dll build/bink_huffman_codebook.so
      - name: Differential Bink Huffman byte and RLE token decoder (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/entropy_byte_rle.cpp -o build/bink_entropy_byte_rle.so
          python tests/dlls/differential_entropy_byte_rle.py originals/dlls/binkw64.dll build/bink_entropy_byte_rle.so
      - name: Differential Bink 16-bit delta and RLE coefficient decoder (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/entropy_deltas16.cpp -o build/bink_entropy_deltas16.so
          python tests/dlls/differential_entropy_deltas16.py originals/dlls/binkw64.dll build/bink_entropy_deltas16.so
      - name: Differential Bink signed-byte entropy decoder (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/entropy_signed_bytes.cpp -o build/bink_entropy_signed.so
          python tests/dlls/differential_entropy_signed.py originals/dlls/binkw64.dll build/bink_entropy_signed.so
      - name: Differential Bink nibble-pair entropy decoder (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/entropy_nibbles.cpp -o build/bink_entropy_nibbles.so
          python tests/dlls/differential_entropy_nibbles.py originals/dlls/binkw64.dll build/bink_entropy_nibbles.so
      - name: Differential Bink Huffman byte entropy decoder (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/entropy_bytes.cpp -o build/bink_entropy_bytes.so
          python tests/dlls/differential_entropy_bytes.py originals/dlls/binkw64.dll build/bink_entropy_bytes.so
      - name: Differential original Bink video residual and reference prediction
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/video_inverse8x8.cpp \
            reconstructed_dlls/bink/video_predict8x8_core.cpp \
            reconstructed_dlls/bink/video_predict8x8.cpp \
            -o build/bink_video_predict8x8.so
          python tests/dlls/differential_video_predict8x8.py originals/dlls/binkw64.dll build/bink_video_predict8x8.so
      - name: Differential original Bink video bitmask byte interleaving
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/video_interleave_bytes.cpp -o build/bink_video_interleave.so
          python tests/dlls/differential_video_interleave.py originals/dlls/binkw64.dll build/bink_video_interleave.so
      - name: Differential original Bink 8x8 inverse plus 2x expansion
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/video_inverse8x8.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x.cpp \
            -o build/bink_inverse8x8_2x.so
          python tests/dlls/differential_video_inverse8x8_2x.py originals/dlls/binkw64.dll build/bink_inverse8x8_2x.so
      - name: Differential original Bink video inverse 8x8 blocks
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/video_inverse8x8.cpp -o build/bink_video_inverse8x8.so
          python tests/dlls/differential_video_inverse8x8.py originals/dlls/binkw64.dll build/bink_video_inverse8x8.so
      - name: Differential original Bink audio sample permutations
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/audio_permute32.cpp -o build/bink_audio_permute32.so
          python tests/dlls/differential_audio_permute32.py originals/dlls/binkw64.dll build/bink_audio_permute32.so
      - name: Differential Bink audio rotation stage (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -fno-fast-math -ffp-contract=off \
            -Wall -Wextra -Werror reconstructed_dlls/bink/transform_rotate.cpp -o build/bink_rotate_test.so
          python tests/dlls/differential_rotate.py originals/dlls/binkw64.dll build/bink_rotate_test.so
      - name: Differential Bink keyframe seeker (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/bink_keyframe.cpp -o build/bink_keyframe_test.so
          python tests/dlls/differential_keyframe.py originals/dlls/binkw64.dll build/bink_keyframe_test.so
      - name: Differential XCurl easy getinfo option dispatch (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/xcurl/getinfo_unlocked.cpp -o build/xcurl_getinfo_test.so
          python tests/dlls/differential_xcurl_getinfo.py originals/dlls/XCurl.dll build/xcurl_getinfo_test.so
      - name: Differential XCurl easy error strings (original vs source)
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/xcurl/easy_strerror.cpp -o build/xcurl_strerror_test.so
          python tests/dlls/differential_xcurl_strerror.py originals/dlls/XCurl.dll build/xcurl_strerror_test.so
      - name: Parse three original Bink compressed frame indexes
        run: |
          python tools/dlls/fetch_bik_fixtures.py originals/bik
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            reconstructed_dlls/bink/header_validation.cpp \
            reconstructed_dlls/bink/bink_index.cpp \
            reconstructed_dlls/bink/test_bink_index.cpp -o /tmp/test_bink_index
          /tmp/test_bink_index originals/bik/la_pip_seq_6.bik \
            originals/bik/karma_pip_security_feed.bik originals/bik/yemen_drone_cam.bik
      - name: Probe actual BO2 Bink keyframe through original video decoder (diagnostic)
        run: |
          python tools/dlls/probe_original_bik_frame.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            --report build/real-bink-frame-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-bink-real-frame-probe
          path: build/real-bink-frame-probe.json
          if-no-files-found: warn
      - name: Fetch originals
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tools/fetch_originals.py $b originals --only exe; done
      - name: Compile reconstruction
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tools/build_recon.py --build $b; done
      - name: Differential tests
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tests/differential/run.py --build $b --check-records; done
      - name: Enhanced build
        run: |
          for b in CoDMPServer_PC t6mp_msstore; do
            python tools/build_recon.py --build $b --enhanced
            python tests/differential/run.py --build $b --enhanced
            python tests/enhanced/run.py --build $b
          done
      - name: Enhanced runtime package
        run: python tools/build_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: enhanced-runtime
          path: |
            build/t6mp_msstore/runtime/XINPUT1_4.dll
            build/t6mp_msstore/runtime/t6_enhanced.dll
      - name: Generated files are current
        run: |
          python tools/inventory/retail_calls.py originals/t6mp.exe
          (cd tools && python inventory.py t6mp_msstore ../originals/t6mp_msstore.exe)
          python tools/status.py
          git diff --exit-code -- analysis/t6mp/direct-entries.tsv analysis/t6mp_msstore/pe.json analysis/t6mp_msstore/pdata.tsv STATUS.md
