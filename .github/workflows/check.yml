name: Reconstruction checks

# Every push: the reconstruction compiles for every build it is tested on (hybrid-linked DLLs: x86 for the servers
# and the Steam exe, x64 for the Store build), every differential test passes, records/ claims only what the tests
# show, and the generated inventory and STATUS.md are current.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    env:
      T6_ORIGINALS: originals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q clang lld llvm >/dev/null
          clang --version | head -1
          pip install -q -r tests/differential/requirements.txt
      - name: Reconstructed external-DLL source-body tests (not differential yet)
        run: |
          for test in reconstructed_dlls/bink/test_bink_small.cpp reconstructed_dlls/bink/test_bink_leaf.cpp reconstructed_dlls/bink/test_bink_frames.cpp reconstructed_dlls/bink/test_bink_dispatch.cpp reconstructed_dlls/xcurl/test_slist.cpp reconstructed_dlls/xcurl/test_duplicate_string.cpp; do
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer "$test" -o /tmp/bink_leaf_test
            /tmp/bink_leaf_test
          done
      - name: Emulate pinned original Bink leaf functions (oracle, not differential)
        run: |
          python tools/dlls/fetch.py originals/dlls
          python tests/dlls/oracle_bink.py originals/dlls/binkw64.dll
      - name: Differential Bink frame metadata (Unicorn vs reconstructed C++)
        run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/bink/bink_frames.cpp -o build/bink_frames_test.so
          python tests/dlls/differential_frames.py originals/dlls/binkw64.dll build/bink_frames_test.so
      - name: Fetch originals
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tools/fetch_originals.py $b originals --only exe; done
      - name: Compile reconstruction
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tools/build_recon.py --build $b; done
      - name: Differential tests
        run: |
          for b in CoDMPServer_PC t6mp t6mp_msstore; do python tests/differential/run.py --build $b --check-records; done
      - name: Enhanced build
        run: |
          for b in CoDMPServer_PC t6mp_msstore; do
            python tools/build_recon.py --build $b --enhanced
            python tests/differential/run.py --build $b --enhanced
            python tests/enhanced/run.py --build $b
          done
      - name: Enhanced runtime package
        run: python tools/build_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: enhanced-runtime
          path: |
            build/t6mp_msstore/runtime/XINPUT1_4.dll
            build/t6mp_msstore/runtime/t6_enhanced.dll
      - name: Generated files are current
        run: |
          python tools/inventory/retail_calls.py originals/t6mp.exe
          (cd tools && python inventory.py t6mp_msstore ../originals/t6mp_msstore.exe)
          python tools/status.py
          git diff --exit-code -- analysis/t6mp/direct-entries.tsv analysis/t6mp_msstore/pe.json analysis/t6mp_msstore/pdata.tsv STATUS.md
