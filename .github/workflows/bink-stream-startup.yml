name: Bink original streaming startup state
on:
  push:
    paths:
      - tests/dlls/probe_bink_memory_open.py
      - .github/workflows/bink-stream-startup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stream-startup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clip: [blackout_virus, yemen_mendz]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/differential
            tests/dlls
            tools/dlls
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: |
          python tools/dlls/fetch.py originals/dlls
          CLIP="${{ matrix.clip }}.bik" PYTHONPATH=tests/dlls python - <<'PY'
          import json, os
          from pathlib import Path
          from verify_bink_corpus import fetch, MANIFEST
          clips={c["name"]:c for c in json.loads(MANIFEST.read_text())["clips"]}
          fetch(clips[os.environ["CLIP"]],Path("originals/bik"))
          PY
      - name: Inspect original small-buffer BinkOpen before worker execution
        run: |
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --flags 0x01104400 --io-size 0x10000 --defer-worker --out build/stream-startup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bink-stream-startup-${{ matrix.clip }}
          path: build/stream-startup.json
          if-no-files-found: warn
