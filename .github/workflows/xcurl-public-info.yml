name: XCurl original public getinfo and API accounting
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/api_profile.*
      - tests/dlls/differential_xcurl_public_info.py
      - .github/workflows/xcurl-public-info.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/dlls
            tests/differential
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q -r tests/differential/requirements.txt
          python tools/dlls/fetch.py originals/dlls
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/xcurl/{api_profile,getinfo_unlocked}.cpp -o build/xcurl_info.so
          python tests/dlls/differential_xcurl_public_info.py originals/dlls/XCurl.dll build/xcurl_info.so
