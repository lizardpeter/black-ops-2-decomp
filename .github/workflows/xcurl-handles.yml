name: XCurl original wide strings and handle lifecycle
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/**
      - tests/dlls/differential_xcurl_wide.py
      - tests/dlls/differential_xcurl_handles.py
      - .github/workflows/xcurl-handles.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/dlls
            tests/differential
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q -r tests/differential/requirements.txt
          python tools/dlls/fetch.py originals/dlls
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/xcurl/{option_dispatch,wide_string,handle_lifecycle}.cpp -o build/xcurl_handles.so
          python tests/dlls/differential_xcurl_wide.py originals/dlls/XCurl.dll build/xcurl_handles.so
          python tests/dlls/differential_xcurl_handles.py originals/dlls/XCurl.dll build/xcurl_handles.so
