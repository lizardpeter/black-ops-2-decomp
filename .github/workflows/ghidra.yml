name: Ghidra analysis

on:
  push:
    branches: [analysis/t6mp-pseudocode]
  workflow_dispatch:
    inputs:
      build:
        description: Original build to analyze
        type: choice
        default: CoDMPServer_PC
        options:
          - CoDMPServer_PC
          - t6mp

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUILD_ID: ${{ inputs.build || 't6mp' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Ghidra
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("target.toml", "rb"))["ghidra"])')
          gh release download "Ghidra_${version}_build" --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp
          unzip -q /tmp/ghidra_*.zip -d /tmp/ghidra
      - name: Import and analyze original
        env:
          GHIDRA_HEADLESS_MAXMEM: 6200M
        run: |
          python3 tools/fetch_originals.py "$BUILD_ID" originals
          mkdir -p "$RUNNER_TEMP/project" "$RUNNER_TEMP/raw"
          prepare=()
          if [ "$BUILD_ID" = t6mp ]; then
            prepare=(-preScript InventoryOptions.java)
          elif [ -f "originals/$BUILD_ID.pdb" ]; then
            prepare=(-preScript PrepPdb.java "$PWD/originals/$BUILD_ID.pdb")
          fi
          /tmp/ghidra/ghidra_*/support/analyzeHeadless "$RUNNER_TEMP/project" t6 \
            -import "$PWD/originals/$BUILD_ID.exe" -scriptPath tools/ghidra "${prepare[@]}" \
            -analysisTimeoutPerFile 7200 -max-cpu 2 -log "$RUNNER_TEMP/raw/analyze.log"
          grep -F 'Analysis succeeded for file:' "$RUNNER_TEMP/raw/analyze.log"
          if [ "$BUILD_ID" = t6mp ]; then
            grep -F 'Disabled x86 Constant Reference Analyzer' "$RUNNER_TEMP/raw/analyze.log"
          fi
      - name: Export function inventory and disassembly
        env:
          GHIDRA_HEADLESS_MAXMEM: 3500M
        run: |
          /tmp/ghidra/ghidra_*/support/analyzeHeadless "$RUNNER_TEMP/project" t6 \
            -process "$BUILD_ID.exe" -noanalysis -scriptPath tools/ghidra \
            -postScript ExportAll.java "$RUNNER_TEMP/raw" -max-cpu 2
          test -s "$RUNNER_TEMP/raw/export.complete"
          python3 tools/ghidra/publish.py "$BUILD_ID" "$RUNNER_TEMP/raw" --inventory-only
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-inventory-${{ inputs.build || 't6mp' }}
          path: |
            analysis/${{ inputs.build || 't6mp' }}/inventory.tsv
            ${{ runner.temp }}/raw/functions.tsv
            ${{ runner.temp }}/raw/analyze.log
          if-no-files-found: error
      - name: Decompile saved project and publish analysis
        env:
          GHIDRA_HEADLESS_MAXMEM: 3500M
        run: |
          export GHIDRA_HEADLESS_MAXMEM=1000M
          pids=()
          for shard in 0 1 2 3; do
            project="$RUNNER_TEMP/project-$shard"
            mkdir -p "$project"
            cp -a "$RUNNER_TEMP/project/t6.gpr" "$RUNNER_TEMP/project/t6.rep" "$project/"
            /tmp/ghidra/ghidra_*/support/analyzeHeadless "$project" t6 \
              -process "$BUILD_ID.exe" -noanalysis -readOnly -scriptPath tools/ghidra \
              -postScript Decompile.java "$RUNNER_TEMP/raw/decomp-$shard.jsonl" "$shard" 4 30 \
              -max-cpu 1 -log "$RUNNER_TEMP/raw/decompile-$shard.log" \
              > "$RUNNER_TEMP/raw/decompile-$shard.console.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          if [ "$failed" != 0 ]; then tail -50 "$RUNNER_TEMP"/raw/decompile-*.console.log; exit 1; fi
          python3 - "$RUNNER_TEMP/raw" <<'PYTHON'
          import csv, json, sys
          from pathlib import Path
          raw = Path(sys.argv[1])
          with (raw / "functions.tsv").open() as stream:
              expected = {r["va"] for r in csv.DictReader(stream, delimiter="\t") if not r["thunk"]}
          seen = set()
          for path in sorted(raw.glob("decomp-*.jsonl")):
              for line in path.open():
                  row = json.loads(line)
                  assert row["va"] not in seen, row["va"]
                  assert ("c" in row) != ("error" in row), row["va"]
                  seen.add(row["va"])
          assert seen == expected, (len(seen - expected), len(expected - seen))
          print(f"Verified decompiler records for {len(seen):,} non-thunk functions.")
          PYTHON
          python3 tools/ghidra/publish.py "$BUILD_ID" "$RUNNER_TEMP/raw"
          python3 tools/status.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ inputs.build || 't6mp' }}
          path: |
            analysis/${{ inputs.build || 't6mp' }}/
            STATUS.md
      - name: Commit the pseudocode and function tables
        if: github.ref == 'refs/heads/analysis/t6mp-pseudocode'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "analysis/$BUILD_ID/pseudocode" "analysis/$BUILD_ID/functions.tsv" \
            "analysis/$BUILD_ID/ghidra/functions.tsv" "analysis/$BUILD_ID/inventory.tsv" STATUS.md
          git commit -m "Export all retail T6 Ghidra pseudocode"
          git push origin HEAD:refs/heads/analysis/t6mp-pseudocode

