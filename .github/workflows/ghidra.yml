name: Ghidra analysis

on:
  workflow_dispatch:
    inputs:
      build:
        description: Original build to analyze
        type: choice
        default: CoDMPServer_PC
        options:
          - CoDMPServer_PC
          - t6mp

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUILD_ID: ${{ inputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Ghidra
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("target.toml", "rb"))["ghidra"])')
          gh release download "Ghidra_${version}_build" --repo NationalSecurityAgency/ghidra --pattern 'ghidra_*_PUBLIC_*.zip' --dir /tmp
          unzip -q /tmp/ghidra_*.zip -d /tmp/ghidra
      - name: Import original and export analysis
        run: |
          python3 tools/fetch_originals.py "$BUILD_ID" originals
          mkdir -p "$RUNNER_TEMP/project" "$RUNNER_TEMP/raw"
          pdb=()
          if [ -f "originals/$BUILD_ID.pdb" ]; then
            pdb=(-preScript PrepPdb.java "$PWD/originals/$BUILD_ID.pdb")
          fi
          /tmp/ghidra/ghidra_*/support/analyzeHeadless "$RUNNER_TEMP/project" t6 \
            -import "$PWD/originals/$BUILD_ID.exe" -scriptPath tools/ghidra "${pdb[@]}" \
            -postScript ExportAll.java "$RUNNER_TEMP/raw" \
            -postScript Decompile.java "$RUNNER_TEMP/raw/decomp-0.jsonl" 0 1 30 \
            -analysisTimeoutPerFile 7200 -log "$RUNNER_TEMP/raw/analyze.log"
          test -s "$RUNNER_TEMP/raw/functions.tsv"
          test -s "$RUNNER_TEMP/raw/decomp-0.jsonl"
          python3 tools/ghidra/publish.py "$BUILD_ID" "$RUNNER_TEMP/raw"
          python3 tools/status.py
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ inputs.build }}
          path: |
            analysis/${{ inputs.build }}/
            STATUS.md
