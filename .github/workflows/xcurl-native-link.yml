name: XCurl native source-link research
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/**
      - .github/workflows/xcurl-native-link.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-link:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S reconstructed_dlls/xcurl -B build/xcurl -DCMAKE_BUILD_TYPE=Release
          cmake --build build/xcurl --config Release --parallel 2
          ctest --test-dir build/xcurl -C Release --output-on-failure
      - if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, subprocess, sys
          subprocess.run([sys.executable,"-m","pip","install","pefile"],check=True)
          import pefile
          p=next(pathlib.Path("build/xcurl").rglob("test_xcurl_native_link.exe"))
          imports=[d.dll.decode().lower() for d in pefile.PE(str(p)).DIRECTORY_ENTRY_IMPORT]
          print(imports)
          assert not any("curl" in d for d in imports), imports
