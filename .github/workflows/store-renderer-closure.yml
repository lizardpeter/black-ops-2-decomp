name: Store renderer dependency closure
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inventory/store_renderer_closure.py'
      - '.github/workflows/store-renderer-closure.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 pefile==2024.8.26
      - run: python tools/fetch_originals.py t6mp_msstore originals --only exe
      - run: python tools/inventory/store_renderer_closure.py originals/t6mp_msstore.exe renderer-closure --limit 384
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-renderer-closure
          path: renderer-closure
