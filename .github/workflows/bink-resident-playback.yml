name: Bink resident handle playback integration
on:
  push:
    paths:
      - reconstructed_dlls/bink/resident_video_session.*
      - reconstructed_dlls/bink/resident_frame_state.*
      - reconstructed_dlls/bink/resident_bootstrap.*
      - reconstructed_dlls/bink/test_resident_video_session.cpp
      - .github/workflows/bink-resident-playback.yml
      - tests/dlls/probe_bink_memory_open.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident-playback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clip: [la_pip_seq_6, generalstore, yemen_mendz, blackout_virus, karma_pip_helipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-DLL emulation requirements
        run: pip install -q -r tests/differential/requirements.txt
      - name: Fetch SHA-pinned originals
        run: |
          python tools/dlls/fetch.py originals/dlls
          python tools/dlls/fetch_bik_fixtures.py originals/bik
          python tests/dlls/differential_bink_coordinator.py --fetch-alpha originals/bik
      - name: Compile source-only plane decoder
        run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/huffman_codebook.cpp \
            reconstructed_dlls/bink/entropy_byte_rle.cpp \
            reconstructed_dlls/bink/entropy_adaptive_pairs.cpp \
            reconstructed_dlls/bink/entropy_nibbles.cpp \
            reconstructed_dlls/bink/entropy_signed_bytes.cpp \
            reconstructed_dlls/bink/entropy_deltas16.cpp \
            reconstructed_dlls/bink/entropy_bytes.cpp \
            reconstructed_dlls/bink/video_coefficients.cpp \
            reconstructed_dlls/bink/video_inverse8x8.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x.cpp \
            reconstructed_dlls/bink/video_inverse8x8_indexed.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x_indexed.cpp \
            reconstructed_dlls/bink/video_block_modes.cpp \
            reconstructed_dlls/bink/video_predict8x8_core.cpp \
            reconstructed_dlls/bink/video_predict8x8.cpp \
            reconstructed_dlls/bink/video_sparse_residual.cpp \
            reconstructed_dlls/bink/video_luma_first_keyframe.cpp \
            -o build/bink_source.so
          clang++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror \
            reconstructed_dlls/bink/header_validation.cpp \
            reconstructed_dlls/bink/bink_index.cpp \
            reconstructed_dlls/bink/resident_frame_state.cpp \
            reconstructed_dlls/bink/resident_bootstrap.cpp \
            reconstructed_dlls/bink/resident_video_session.cpp \
            reconstructed_dlls/bink/test_resident_video_session.cpp build/bink_source.so \
            -Wl,-rpath,"$PWD/build" -o build/test_resident_video_session
      - name: Compare independently routed original full-frame coordinator
        run: |
          python tests/dlls/differential_bink_coordinator.py \
            --dll originals/dlls/binkw64.dll \
            --video "originals/bik/${{ matrix.clip }}.bik" \
            --library build/bink_source.so --frames 16
      - name: Compare integrated resident handle playback against original pixels
        run: |
          build/test_resident_video_session "originals/bik/${{ matrix.clip }}.bik" build/playback.yuv
          cmp build/playback.yuv build/coordinator-matched.yuv
          build/test_resident_video_session "originals/bik/${{ matrix.clip }}.bik" build/playback-async.yuv --async
          cmp build/playback-async.yuv build/playback.yuv
          build/test_resident_video_session "originals/bik/${{ matrix.clip }}.bik" build/playback-file.yuv --file
          cmp build/playback-file.yuv build/playback.yuv
          build/test_resident_video_session "originals/bik/${{ matrix.clip }}.bik" build/playback-file-async.yuv --file --async
          cmp build/playback-file-async.yuv build/playback.yuv
      - name: Compare full original public synchronous and async playback against native pixels
        run: |
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --out build/original-public-sync.json --playback-out build/original-public-sync.yuv
          cmp build/playback.yuv build/original-public-sync.yuv
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --out build/original-public-async.json --playback-out build/original-public-async.yuv --async-playback
          cmp build/playback.yuv build/original-public-async.yuv
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --flags 0x01104400 --io-size 0x1000000 \
            --out build/original-public-file-sync.json --playback-out build/original-public-file-sync.yuv
          cmp build/playback-file.yuv build/original-public-file-sync.yuv
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --flags 0x01104400 --io-size 0x1000000 \
            --out build/original-public-file-async.json --playback-out build/original-public-file-async.yuv --async-playback
          cmp build/playback-file-async.yuv build/original-public-file-async.yuv
      - name: Preserve coordinator diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-playback-${{ matrix.clip }}
          path: |
            build/coordinator-report.json
            build/original-public-*.json
          if-no-files-found: warn
