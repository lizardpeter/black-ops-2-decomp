name: XCurl native Windows loopback transport
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/**
      - reconstructed_dlls/xcurl/gdk_runtime.*
      - reconstructed_dlls/xcurl/gdk_interfaces.*
      - tests/dlls/verify_xcurl_winhttp.py
      - tests/dlls/verify_xcurl_tls.py
      - .github/workflows/xcurl-winhttp-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile==2024.8.26 cryptography
      - name: Configure
        run: cmake -S reconstructed_dlls/xcurl -B build/xcurl -A x64
      - name: Build
        run: cmake --build build/xcurl --config Release --target test_xcurl_winhttp test_xcurl_game_pipeline
      - name: Native transport leaves
        run: python tests/dlls/verify_xcurl_winhttp.py build/xcurl/Release/test_xcurl_winhttp.exe
      - name: Full game-facing HTTP pipeline
        run: python tests/dlls/verify_xcurl_winhttp.py build/xcurl/Release/test_xcurl_game_pipeline.exe
      - name: HTTPS and mutual TLS pipeline
        if: success() || failure()
        run: python tests/dlls/verify_xcurl_tls.py build/xcurl/Release/test_xcurl_game_pipeline.exe
