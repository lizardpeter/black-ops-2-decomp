name: XCurl original request engine and WinHTTP boundaries
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/request_engine.*
      - reconstructed_dlls/xcurl/http_setup.*
      - reconstructed_dlls/xcurl/session_cache.*
      - reconstructed_dlls/xcurl/response_body.*
      - reconstructed_dlls/xcurl/transfer_callbacks.*
      - reconstructed_dlls/xcurl/header_query.*
      - reconstructed_dlls/xcurl/response_headers.*
      - reconstructed_dlls/xcurl/url_crack.*
      - reconstructed_dlls/xcurl/upload_engine.*
      - reconstructed_dlls/xcurl/upload_buffer.*
      - reconstructed_dlls/xcurl/request_start.*
      - reconstructed_dlls/xcurl/request_headers.*
      - reconstructed_dlls/xcurl/certificate.*
      - reconstructed_dlls/xcurl/gdk_interfaces.*
      - tests/dlls/differential_xcurl_start.py
      - tests/dlls/differential_xcurl_gdk_interfaces.py
      - tests/dlls/differential_xcurl_certificate.py
      - tests/dlls/differential_xcurl_add_headers.py
      - tests/dlls/differential_xcurl_start.py
      - tests/dlls/differential_xcurl_upload_buffer.py
      - tests/dlls/verify_xcurl_upload_buffer_safety.py
      - tests/dlls/differential_xcurl_upload.py
      - tests/dlls/differential_xcurl_url.py
      - tests/dlls/differential_xcurl_receive_headers.py
      - tests/dlls/differential_xcurl_header_query.py
      - tests/dlls/differential_xcurl_callbacks.py
      - tests/dlls/differential_xcurl_body.py
      - tests/dlls/differential_xcurl_delivery.py
      - tests/dlls/differential_xcurl_session.py
      - tests/dlls/differential_xcurl_http_setup.py
      - tests/dlls/differential_xcurl_copy_utf16.py
      - reconstructed_dlls/xcurl/request_prepare.*
      - tests/dlls/differential_xcurl_prepare.py
      - reconstructed_dlls/xcurl/http_status.*
      - reconstructed_dlls/xcurl/engine_scheduler.*
      - tests/dlls/differential_xcurl_scheduler.py
      - tests/dlls/differential_xcurl_status.py
      - tests/dlls/differential_xcurl_request.py
      - .github/workflows/xcurl-request-engine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/differential
            tests/dlls
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -q -r tests/differential/requirements.txt
          python tools/dlls/fetch.py originals/dlls
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/xcurl/request_engine.cpp reconstructed_dlls/xcurl/http_status.cpp reconstructed_dlls/xcurl/engine_scheduler.cpp reconstructed_dlls/xcurl/request_prepare.cpp reconstructed_dlls/xcurl/http_setup.cpp reconstructed_dlls/xcurl/session_cache.cpp reconstructed_dlls/xcurl/response_body.cpp reconstructed_dlls/xcurl/transfer_callbacks.cpp reconstructed_dlls/xcurl/header_query.cpp reconstructed_dlls/xcurl/response_headers.cpp reconstructed_dlls/xcurl/url_crack.cpp reconstructed_dlls/xcurl/upload_engine.cpp reconstructed_dlls/xcurl/upload_buffer.cpp reconstructed_dlls/xcurl/request_start.cpp reconstructed_dlls/xcurl/request_headers.cpp reconstructed_dlls/xcurl/certificate.cpp reconstructed_dlls/xcurl/gdk_interfaces.cpp reconstructed_dlls/xcurl/wide_string.cpp reconstructed_dlls/xcurl/option_dispatch.cpp -o build/xcurl_request.so
          python tests/dlls/differential_xcurl_request.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_status.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_scheduler.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_prepare.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_http_setup.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_copy_utf16.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_session.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_body.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_delivery.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_callbacks.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_header_query.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_receive_headers.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_url.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_upload.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_upload_buffer.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/verify_xcurl_upload_buffer_safety.py build/xcurl_request.so
          python tests/dlls/differential_xcurl_start.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_gdk_interfaces.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_add_headers.py originals/dlls/XCurl.dll build/xcurl_request.so
          python tests/dlls/differential_xcurl_certificate.py originals/dlls/XCurl.dll build/xcurl_request.so
