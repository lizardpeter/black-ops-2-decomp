name: Bink original resident frame state
on:
  push:
    paths:
      - reconstructed_dlls/bink/resident_frame_state.*
      - tests/dlls/differential_bink_resident_state.py
      - tests/dlls/differential_bink_video_state.py
      - .github/workflows/bink-resident-state.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/bink
            tests/differential
            tests/dlls
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: python tools/dlls/fetch.py originals/dlls
      - run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/resident_frame_state.cpp -o build/bink_resident_state.so
          python tests/dlls/differential_bink_resident_state.py \
            originals/dlls/binkw64.dll build/bink_resident_state.so
          python tests/dlls/differential_bink_video_state.py \
            originals/dlls/binkw64.dll build/bink_resident_state.so
