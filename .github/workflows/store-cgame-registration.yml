name: Store client-game dvar registration replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/cgame_mp/cg_register_dvars_store.cpp'
      - 'src/cgame_mp/cg_fov_mode_store.cpp'
      - 'src/cgame_mp/cg_view_fov_store.cpp'
      - 'src/cgame/cg_fov_defaults_store.cpp'
      - 'src/cgame/cg_camera_projection_store.cpp'
      - 'src/cgame/cg_turret_fov_store.cpp'
      - 'src/cgame/cg_weapon_fov_store.cpp'
      - 'src/cgame_mp/cg_extra_camera_store.cpp'
      - 'src/cgame/cg_camera_support_store.cpp'
      - 'src/cgame_mp/cg_main_view_store.cpp'
      - 'src/cgame/cg_camera_motion_store.cpp'
      - 'src/cgame_mp/cg_camera_effects_store.cpp'
      - 'src/cgame/cg_camera_mode_store.cpp'
      - 'src/cgame_mp/cg_third_person_store.cpp'
      - 'src/cgame/cg_camera_detail_store.cpp'
      - 'src/bgame/bg_camera_bob_store.cpp'
      - 'src/cgame/cg_third_person_trace_store.cpp'
      - 'tests/verify_store_camera_win64_objects.py'
      - 'src/cgame_mp/cg_chase_camera_store.cpp'
      - 'src/cgame/cg_camera_angles_store.cpp'
      - 'tests/store_camera_angles_probe.cpp'
      - 'tests/verify_store_camera_angles.py'
      - 'tests/store_chase_camera_probe.cpp'
      - 'tests/verify_store_chase_camera.py'
      - 'tests/store_camera_trace_probe.cpp'
      - 'tests/verify_store_camera_trace.py'
      - 'tests/store_camera_bob_probe.cpp'
      - 'tests/verify_store_camera_bob.py'
      - 'tests/store_camera_detail_probe.cpp'
      - 'tests/verify_store_camera_detail.py'
      - 'tests/store_third_person_probe.cpp'
      - 'tests/verify_store_third_person.py'
      - 'tests/store_camera_mode_probe.cpp'
      - 'tests/verify_store_camera_mode.py'
      - 'tests/store_camera_effects_probe.cpp'
      - 'tests/verify_store_camera_effects.py'
      - 'tests/store_camera_motion_probe.cpp'
      - 'tests/verify_store_camera_motion.py'
      - 'tests/store_main_view_probe.cpp'
      - 'tests/verify_store_main_view.py'
      - 'tests/store_camera_support_probe.cpp'
      - 'tests/verify_store_camera_support.py'
      - 'tests/store_extra_camera_probe.cpp'
      - 'tests/verify_store_extra_camera.py'
      - 'tests/store_weapon_fov_probe.cpp'
      - 'tests/verify_store_weapon_fov.py'
      - 'tests/store_turret_fov_probe.cpp'
      - 'tests/verify_store_turret_fov.py'
      - 'tests/store_camera_pipeline_probe.cpp'
      - 'tests/verify_store_camera_pipeline.py'
      - 'tests/store_camera_fov_probe.cpp'
      - 'tests/verify_store_camera_fov.py'
      - 'tests/store_cg_fov_mode_probe.cpp'
      - 'tests/verify_store_cg_fov_mode.py'
      - 'src/qcommon/common_register_dvars_store.cpp'
      - 'src/universal/dvar_registration_store.cpp'
      - 'tests/store_dvar_core_test.cpp'
      - 'tests/store_dvar_setter_probe.cpp'
      - 'tests/verify_store_dvar_setters.py'
      - 'tests/store_common_registration_probe.cpp'
      - 'tests/verify_store_common_registration.py'
      - 'tests/store_cgame_registration_probe.cpp'
      - 'tests/verify_store_cgame_registration.py'
      - 'src/gfx_d3d/r_dvars_store.cpp'
      - 'tests/store_renderer_prefix_probe.cpp'
      - 'tests/verify_store_renderer_prefix.py'
      - 'tests/verify_store_renderer_workers.py'
      - 'tests/verify_store_renderer_post_worker.py'
      - 'tests/verify_store_renderer_integrated.py'
      - 'tests/verify_store_renderer_extended.py'
      - 'tests/verify_store_renderer_complete.py'
      - 'tests/verify_store_renderer_native_bindings.py'
      - 'records/store-renderer-bindings.tsv'
      - 'enhanced/gfx_d3d/r_dvars.cpp'
      - 'tools/build_recon.py'
      - 'tools/build_runtime.py'
      - 'tools/symbols.py'
      - 'tools/inventory/store_renderer_registration.py'
      - 'tools/inventory/store_dvar_next.py'
      - 'docs/store-renderer-dvar-registration.tsv'
      - '.github/workflows/store-cgame-registration.yml'
permissions:
  contents: read
jobs:
  mp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core dvar source-body regression (no PE)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/store_dvar_core_test.cpp -o /tmp/store_dvar_core
          /tmp/store_dvar_core
      - name: Fetch hash-pinned Store MP original
        run: python tools/fetch_originals.py t6mp_msstore originals --only exe
      - name: Replay full registration body
        run: |
          set -o pipefail
          python tests/verify_store_cgame_registration.py originals/t6mp_msstore.exe | tee registration-replay.log
      - name: Replay common registration body
        run: |
          set -o pipefail
          python tests/verify_store_common_registration.py originals/t6mp_msstore.exe | tee common-registration-replay.log
      - name: Extract renderer registration operands and control flow
        run: |
          python -m pip install capstone==5.0.6 pefile==2024.8.26
          python tools/inventory/store_renderer_registration.py originals/t6mp_msstore.exe renderer-evidence
      - name: Replay recovered renderer entry prefix
        run: |
          set -o pipefail
          python tests/verify_store_renderer_prefix.py originals/t6mp_msstore.exe | tee renderer-prefix-replay.log
      - name: Replay recovered worker registration fragment
        run: |
          set -o pipefail
          python tests/verify_store_renderer_workers.py originals/t6mp_msstore.exe | tee renderer-worker-replay.log
      - name: Replay recovered post-worker renderer fragment
        run: |
          set -o pipefail
          python tests/verify_store_renderer_post_worker.py originals/t6mp_msstore.exe | tee renderer-post-worker-replay.log
      - name: Replay continuous recovered renderer prefix
        run: |
          set -o pipefail
          python tests/verify_store_renderer_integrated.py originals/t6mp_msstore.exe | tee renderer-integrated-replay.log
      - name: Replay continuous renderer shadow and stereo extension
        run: |
          set -o pipefail
          python tests/verify_store_renderer_extended.py originals/t6mp_msstore.exe | tee renderer-extended-replay.log
      - name: Replay complete renderer registration body
        run: |
          set -o pipefail
          python tests/verify_store_renderer_complete.py originals/t6mp_msstore.exe | tee renderer-complete-replay.log
      - name: Audit native renderer bindings and compile Windows x64 objects
        run: |
          set -o pipefail
          python tests/verify_store_renderer_native_bindings.py originals/t6mp_msstore.exe renderer-evidence/renderer-evidence.json | tee renderer-native-bindings.log
      - name: Extract exact Store MP FOV references and dvar core bodies
        run: |
          set -o pipefail
          python tools/inventory/store_dvar_next.py originals/t6mp_msstore.exe dvar-next-evidence | tee dvar-next.log
      - name: Replay original Store latched and float setters
        run: |
          set -o pipefail
          python tests/verify_store_dvar_setters.py originals/t6mp_msstore.exe | tee dvar-setters.log
      - name: Replay complete Store HUD and FOV mode helper
        run: |
          set -o pipefail
          python tests/verify_store_cg_fov_mode.py originals/t6mp_msstore.exe | tee fov-mode.log
      - name: Replay complete Store camera FOV calculation
        run: |
          set -o pipefail
          python tests/verify_store_camera_fov.py originals/t6mp_msstore.exe | tee camera-fov.log
      - name: Replay Store default FOV and complete projection functions
        run: |
          set -o pipefail
          python tests/verify_store_camera_pipeline.py originals/t6mp_msstore.exe | tee camera-pipeline.log
      - name: Replay complete Store turret FOV function
        run: |
          set -o pipefail
          python tests/verify_store_turret_fov.py originals/t6mp_msstore.exe | tee camera-turret.log
      - name: Replay complete Store weapon and ADS FOV function
        run: |
          set -o pipefail
          python tests/verify_store_weapon_fov.py originals/t6mp_msstore.exe | tee camera-weapon.log
      - name: Replay complete Store extra-camera view function
        run: |
          set -o pipefail
          python tests/verify_store_extra_camera.py originals/t6mp_msstore.exe | tee camera-extra.log
      - name: Replay Store camera mode and ADS transition accessors
        run: |
          set -o pipefail
          python tests/verify_store_camera_support.py originals/t6mp_msstore.exe | tee camera-support.log
      - name: Compile complete Store main view source candidate
        run: g++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -Werror -DT6_STORE -DT6_STORE_CAMERA_REPLAY -c src/cgame_mp/cg_main_view_store.cpp -o /tmp/store-main-view.o
      - name: Replay complete Store main camera view orchestration
        run: |
          set -o pipefail
          python tests/verify_store_main_view.py originals/t6mp_msstore.exe | tee camera-main-view.log
      - name: Replay Store angle axes velocity perturbation and tween
        run: |
          set -o pipefail
          python tests/verify_store_camera_motion.py originals/t6mp_msstore.exe | tee camera-motion.log
      - name: Replay complete first person view and camera shake
        run: |
          set -o pipefail
          python tests/verify_store_camera_effects.py originals/t6mp_msstore.exe | tee camera-effects.log
      - name: Replay complete Store camera mode selection
        run: |
          set -o pipefail
          python tests/verify_store_camera_mode.py originals/t6mp_msstore.exe | tee camera-mode.log
      - name: Replay complete Store third-person camera body
        run: |
          set -o pipefail
          python tests/verify_store_third_person.py originals/t6mp_msstore.exe | tee camera-third.log
      - name: Replay shake attenuation origin offset and remote eyes
        run: |
          set -o pipefail
          python tests/verify_store_camera_detail.py originals/t6mp_msstore.exe | tee camera-detail.log
      - name: Replay Store vertical and horizontal camera bob
        run: |
          set -o pipefail
          python tests/verify_store_camera_bob.py originals/t6mp_msstore.exe | tee camera-bob.log
      - name: Replay complete Store third-person collision trace wrapper
        run: |
          set -o pipefail
          python tests/verify_store_camera_trace.py originals/t6mp_msstore.exe | tee camera-trace.log
      - name: Replay complete Store chase camera
        run: |
          set -o pipefail
          python tests/verify_store_chase_camera.py originals/t6mp_msstore.exe | tee camera-chase.log
      - name: Replay axis to angles and linked roll
        run: |
          set -o pipefail
          python tests/verify_store_camera_angles.py originals/t6mp_msstore.exe | tee camera-angles.log
      - name: Compile all recovered camera bodies to Windows x64 objects
        run: |
          set -o pipefail
          python tests/verify_store_camera_win64_objects.py | tee camera-win64-objects.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-cgame-registration-replay
          path: |
            registration-replay.log
            common-registration-replay.log
            renderer-evidence/
            renderer-prefix-replay.log
            renderer-worker-replay.log
            renderer-post-worker-replay.log
            renderer-integrated-replay.log
            renderer-extended-replay.log
            renderer-complete-replay.log
            renderer-native-bindings.log
            dvar-next-evidence/
            dvar-next.log
            dvar-setters.log
            fov-mode.log
            camera-fov.log
            camera-pipeline.log
            camera-turret.log
            camera-weapon.log
            camera-extra.log
            camera-support.log
            camera-main-view.log
            camera-motion.log
            camera-effects.log
            camera-mode.log
            camera-third.log
            camera-detail.log
            camera-bob.log
            camera-trace.log
            camera-win64-objects.log
            camera-chase.log
            camera-angles.log
          if-no-files-found: warn
