name: XCurl original URL object differential
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/url_object.*
      - tests/dlls/differential_xcurl_url_object.py
      - .github/workflows/xcurl-url-object.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/differential
            tests/dlls
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: python tools/dlls/fetch.py originals/dlls
      - run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC reconstructed_dlls/xcurl/url_object.cpp -o build/xcurl_url.so
          python tests/dlls/differential_xcurl_url_object.py originals/dlls/XCurl.dll build/xcurl_url.so
