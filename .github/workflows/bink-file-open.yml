name: Bink original Store file-backed lifecycle
on:
  push:
    paths:
      - tests/dlls/probe_bink_memory_open.py
      - .github/workflows/bink-file-open.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-open:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clip: [la_pip_seq_6, blackout_virus, yemen_mendz]
        io_size: ['0x180000','0x10000']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests/differential
            tests/dlls
            tools/dlls
            docs
            reconstructed_dlls/bink
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: |
          python tools/dlls/fetch.py originals/dlls
          CLIP="${{ matrix.clip }}.bik" PYTHONPATH=tests/dlls python - <<'PY'
          import json, os
          from pathlib import Path
          from verify_bink_corpus import fetch, MANIFEST
          clips={c["name"]:c for c in json.loads(MANIFEST.read_text())["clips"]}
          fetch(clips[os.environ["CLIP"]],Path("originals/bik"))
          PY
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/resident_bootstrap.cpp \
            reconstructed_dlls/bink/resident_frame_state.cpp \
            reconstructed_dlls/bink/header_validation.cpp \
            reconstructed_dlls/bink/bink_index.cpp -o build/bink_bootstrap.so
      - name: Execute actual Store file-backed flag path
        run: |
          extra=()
          if [ "${{ matrix.io_size }}" = "0x180000" ] || [ "${{ matrix.clip }}" = "la_pip_seq_6" ]; then extra+=(--library build/bink_bootstrap.so); fi
          python tests/dlls/probe_bink_memory_open.py \
            originals/dlls/binkw64.dll "originals/bik/${{ matrix.clip }}.bik" \
            --flags 0x01104400 --io-size "${{ matrix.io_size }}" --out build/original-file-open.json "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bink-file-open-${{ matrix.clip }}-${{ matrix.io_size }}
          path: build/original-file-open.json
          if-no-files-found: warn
