name: Bink original custom allocator
on:
  push:
    paths:
      - reconstructed_dlls/bink/bink_allocator.*
      - tests/dlls/differential_bink_allocator.py
      - .github/workflows/bink-allocator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allocator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/bink
            tests/differential
            tests/dlls
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: python tools/dlls/fetch.py originals/dlls
      - run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/bink_allocator.cpp -o build/allocator.so
          python tests/dlls/differential_bink_allocator.py originals/dlls/binkw64.dll build/allocator.so
