name: Import verified server analysis
on:
  push:
    branches: [analysis/t6-server]
    paths: [analysis-transfer/**]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack generated files
        run: |
          cat analysis-transfer/server.part-* > "$RUNNER_TEMP/server.tar.xz"
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/analysis-transfer/server.sha256")
          tar -xJf "$RUNNER_TEMP/server.tar.xz"
          python tools/status.py
      - name: Commit generated analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/CoDMPServer_PC STATUS.md
          git rm -r analysis-transfer
          git commit -m "Import verified dedicated-server T6 analysis"
          git push origin HEAD:refs/heads/analysis/t6-server
