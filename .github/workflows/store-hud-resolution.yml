name: Store HUD resolution evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inventory/store_hud_resolution.py'
      - '.github/workflows/store-hud-resolution.yml'
      - 'src/ui/ui_font_assets_store.cpp'
      - 'src/client/screen_placement_store.cpp'
      - 'tests/store_font*probe.cpp'
      - 'src/gfx_d3d/r_font_store.cpp'
      - 'src/gfx_d3d/r_text_commands_store.cpp'
      - 'src/gfx_d3d/rb_font_store.cpp'
      - 'src/gfx_d3d/rb_font_world_store.cpp'
      - 'src/gfx_d3d/r_font_state_store.cpp'
      - 'src/gfx_d3d/r_font_gpu_state_store.cpp'
      - 'src/gfx_d3d/rb_font_geometry_store.cpp'
      - 'src/gfx_d3d/rb_font_effects_store.cpp'
      - 'src/gfx_d3d/r_font_aux_store.cpp'
      - 'src/ui/ui_font_draw_store.cpp'
      - 'src/gfx_d3d/r_fonticon_store.cpp'
      - 'tests/verify_store_font*.py'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 pefile==2024.8.26
      - run: python tools/fetch_originals.py t6mp_msstore originals --only exe
      - run: python tools/inventory/store_hud_resolution.py originals/t6mp_msstore.exe hud-evidence
      - run: python tests/verify_store_font.py originals/t6mp_msstore.exe
      - run: python tests/verify_store_font_core.py originals/t6mp_msstore.exe
        if: always()
      - run: python tests/verify_store_font_command.py originals/t6mp_msstore.exe
        if: always()
      - run: python tests/verify_store_font_backend.py originals/t6mp_msstore.exe
        if: always()
      - run: python tests/verify_store_font_win64.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-hud-evidence
          path: hud-evidence
