name: XCurl independent native consumer
on:
  push:
    paths:
      - reconstructed_dlls/xcurl/**
      - tests/dlls/native_xcurl_consumer/**
      - .github/workflows/xcurl-native-consumer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/xcurl
            tests/dlls/native_xcurl_consumer
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile==2024.8.26
      - name: Configure
        run: cmake -S tests/dlls/native_xcurl_consumer -B build/consumer -A x64
      - name: Build
        run: cmake --build build/consumer --config Release
      - name: PE dependency audit
        run: python -c "import pefile; p=pefile.PE('build/consumer/Release/native_xcurl_consumer.exe'); deps={d.dll.decode().lower() for d in p.DIRECTORY_ENTRY_IMPORT}; assert p.FILE_HEADER.Machine==0x8664 and 'winhttp.dll' in deps and not any('xcurl' in d or 'libcurl' in d for d in deps); print(sorted(deps))"
      - name: Import-slot relocation audit
        run: python tests/dlls/native_xcurl_consumer/verify_import_slots.py build/consumer/Release/native_xcurl_consumer.exe build/consumer/Release/native_xcurl_consumer.map
      - name: Runtime lifecycle acceptance
        run: build/consumer/Release/native_xcurl_consumer.exe
      - name: Reject invalid live-loopback arguments
        shell: python
        run: |
          import subprocess
          exe = "build/consumer/Release/native_xcurl_consumer.exe"
          for args in (["--unknown"], ["--loopback-port", "0"], ["--loopback-port", "65536"], ["--loopback-port", "bad"]):
              assert subprocess.run([exe, *args], timeout=10).returncode == 64
      - uses: actions/upload-artifact@v4
        with:
          name: xcurl-native-consumer
          path: |
            build/consumer/Release/native_xcurl_consumer.exe
            build/consumer/Release/native_xcurl_consumer.map
          if-no-files-found: error
