name: Store input reconstruction evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/inventory/store_input.py'
      - '.github/workflows/store-input.yml'
      - 'src/client/*_store.cpp'
      - 'src/client_mp/*_store.cpp'
      - 'src/cgame_mp/cg_gamepad_store.cpp'
      - 'tests/verify_store_input*.py'
      - 'tests/store_input*.cpp'
      - 'enhanced/win32/win_input.cpp'
      - 'enhanced/win32/win_rawinput.cpp'
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch hash-pinned Store MP original
        run: python tools/fetch_originals.py t6mp_msstore originals --only exe
      - name: Extract exact input function bodies
        run: |
          python -m pip install capstone==5.0.6 pefile==2024.8.26
          python tools/inventory/store_input.py originals/t6mp_msstore.exe input-evidence
      - name: Replay complete Store input support bodies
        run: python tests/verify_store_input_support.py originals/t6mp_msstore.exe
      - name: Replay complete Store input command bodies
        run: python tests/verify_store_input_commands.py originals/t6mp_msstore.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-input-evidence
          path: input-evidence
  win64-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Store input functions to Windows x64 COFF objects
        run: python tests/verify_store_input_win64.py
