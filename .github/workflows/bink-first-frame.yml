name: Bink first real-frame source verification

# Separate fast loop for the *experimental* all-source first BO2 .bik frame.
# Intentionally independent of the full enhanced runtime build and its
# six-minute multi-target integration checks. This job must FAIL on a native
# pixel mismatch; it can never turn an original-only oracle into a PASS.
on:
  push:
    paths:
      - reconstructed_dlls/bink/**
      - tests/dlls/experimental_first_luma.py
      - tests/dlls/differential_first_color_keyframe.py
      - tests/dlls/probe_next_bink_luma.py
      - tests/dlls/differential_bink_sequence.py
      - tests/dlls/differential_video_sparse_residual.py
      - tools/dlls/trace_original_bik_entropy_rows.py
      - tools/dlls/native_bik_decode.cpp
      - tools/dlls/fetch_bik_fixtures.py
      - .github/workflows/bink-first-frame.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-DLL emulation requirements
        run: |
          clang++ --version | head -1
          pip install -q -r tests/differential/requirements.txt
      - name: Fetch pinned original Bink DLL and real BO2 media fixture
        run: |
          python tools/dlls/fetch.py originals/dlls
          python tools/dlls/fetch_bik_fixtures.py originals/bik
      - name: Generate original 256x256 Y-plane oracle
        run: |
          python tools/dlls/probe_original_bik_frame.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            --flags 0 --report build/original-bink-probe.json
      - name: Trace original nine entropy stream refills per tile row
        run: |
          python tools/dlls/trace_original_bik_entropy_rows.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            --out build/original-bink-entropy-rows.json
      - name: Compile reconstructed-only Bink Y-plane decoder
        run: |
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror \
            reconstructed_dlls/bink/huffman_codebook.cpp \
            reconstructed_dlls/bink/entropy_byte_rle.cpp \
            reconstructed_dlls/bink/entropy_adaptive_pairs.cpp \
            reconstructed_dlls/bink/entropy_nibbles.cpp \
            reconstructed_dlls/bink/entropy_signed_bytes.cpp \
            reconstructed_dlls/bink/entropy_deltas16.cpp \
            reconstructed_dlls/bink/entropy_bytes.cpp \
            reconstructed_dlls/bink/video_coefficients.cpp \
            reconstructed_dlls/bink/video_inverse8x8.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x.cpp \
            reconstructed_dlls/bink/video_inverse8x8_indexed.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x_indexed.cpp \
            reconstructed_dlls/bink/video_block_modes.cpp \
            reconstructed_dlls/bink/video_predict8x8_core.cpp \
            reconstructed_dlls/bink/video_predict8x8.cpp \
            reconstructed_dlls/bink/video_sparse_residual.cpp \
            reconstructed_dlls/bink/video_luma_first_keyframe.cpp \
            -o build/bink_source_first_luma.so
      - name: Enforce 65536-byte original-vs-native Y-plane equality
        run: |
          set -o pipefail
          python tests/dlls/experimental_first_luma.py \
            build/bink_source_first_luma.so originals/bik/la_pip_seq_6.bik \
            build/original-bink-luma-frame0.pgm \
            | tee build/first-luma-source-diagnostic.txt
      - name: Compare source Y and sequential chroma planes against original
        run: |
          python tests/dlls/differential_first_color_keyframe.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            build/bink_source_first_luma.so
      - name: Capture next original video frame with verified source keyframe reference
        run: |
          python tests/dlls/probe_next_bink_luma.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            build/native-bink-frame0-Y.pgm build/bink_source_first_luma.so
      - name: Differential original sparse residual bitplane and prediction routines
        run: |
          python tests/dlls/differential_video_sparse_residual.py \
            originals/dlls/binkw64.dll build/bink_source_first_luma.so
      - name: Compare full 150-frame color video sequence (original vs native)
        run: |
          python tests/dlls/differential_bink_sequence.py \
            originals/dlls/binkw64.dll originals/bik/la_pip_seq_6.bik \
            build/bink_source_first_luma.so --frames 150
      - name: Build standalone source-only BIKi video decoder
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror \
            reconstructed_dlls/bink/huffman_codebook.cpp \
            reconstructed_dlls/bink/entropy_byte_rle.cpp \
            reconstructed_dlls/bink/entropy_adaptive_pairs.cpp \
            reconstructed_dlls/bink/entropy_nibbles.cpp \
            reconstructed_dlls/bink/entropy_signed_bytes.cpp \
            reconstructed_dlls/bink/entropy_deltas16.cpp \
            reconstructed_dlls/bink/entropy_bytes.cpp \
            reconstructed_dlls/bink/video_coefficients.cpp \
            reconstructed_dlls/bink/video_inverse8x8.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x.cpp \
            reconstructed_dlls/bink/video_inverse8x8_indexed.cpp \
            reconstructed_dlls/bink/video_inverse8x8_2x_indexed.cpp \
            reconstructed_dlls/bink/video_block_modes.cpp \
            reconstructed_dlls/bink/video_predict8x8_core.cpp \
            reconstructed_dlls/bink/video_predict8x8.cpp \
            reconstructed_dlls/bink/video_sparse_residual.cpp \
            reconstructed_dlls/bink/video_luma_first_keyframe.cpp \
            reconstructed_dlls/bink/header_validation.cpp \
            reconstructed_dlls/bink/bink_index.cpp \
            tools/dlls/native_bik_decode.cpp -o build/bink_decode_video
          ldd build/bink_decode_video
          build/bink_decode_video originals/bik/la_pip_seq_6.bik build/standalone-bink-sequence.yuv
          cmp build/standalone-bink-sequence.yuv build/native-bink-sequence.yuv
          sha256sum build/standalone-bink-sequence.yuv
      - name: Compare two additional pinned BO2 video sequences
        run: |
          failed=0
          for clip in karma_pip_security_feed yemen_drone_cam; do
            if python tests/dlls/differential_bink_sequence.py \
              originals/dlls/binkw64.dll "originals/bik/$clip.bik" \
              build/bink_source_first_luma.so --report "build/$clip/bink-sequence-report.json"; then
              build/bink_decode_video "originals/bik/$clip.bik" "build/$clip/standalone-bink-sequence.yuv" &&
                cmp "build/$clip/standalone-bink-sequence.yuv" "build/$clip/native-bink-sequence.yuv" || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Verify rectangular 512x288 original BO2 video (first 32 frames)
        if: always()
        run: |
          python tests/dlls/differential_bink_sequence.py \
            originals/dlls/binkw64.dll originals/bik/haiti_int_1c.bik \
            build/bink_source_first_luma.so --frames 32 \
            --report build/haiti_int_1c/bink-sequence-report.json
      - name: Preserve source-first-frame diagnostics and original oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-vs-native-bink-first-frame
          path: |
            build/original-bink-luma-frame0.pgm
            build/original-bink-probe.json
            build/original-bink-entropy-rows.json
            build/first-luma-source-diagnostic.txt
            build/native-bink-first-luma-frame0.pgm
            build/bink-first-color-report.json
            build/original-bink-frame0-*.pgm
            build/native-bink-frame0-*.pgm
            build/original-bink-frame1-Y.pgm
            build/native-bink-frame1-Y.pgm
            build/original-bink-frame1-report.json
            build/bink-sequence-report.json
            build/native-bink-sequence.yuv
            build/sequence-failed-*.pgm
            build/standalone-bink-sequence.yuv
            build/bink_decode_video
            build/karma_pip_security_feed/*.json
            build/karma_pip_security_feed/*.pgm
            build/yemen_drone_cam/*.json
            build/yemen_drone_cam/*.pgm
            build/haiti_int_1c/*.json
            build/haiti_int_1c/*.pgm
          if-no-files-found: warn
