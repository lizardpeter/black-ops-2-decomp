name: Bink original async worker lifecycle
on:
  push:
    paths:
      - reconstructed_dlls/bink/async_lifecycle.*
      - tests/dlls/differential_bink_lifecycle.py
      - .github/workflows/bink-worker-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            reconstructed_dlls/bink
            tests/differential
            tests/dlls
            tools/dlls
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r tests/differential/requirements.txt
      - run: python tools/dlls/fetch.py originals/dlls
      - run: |
          mkdir -p build
          clang++ -std=c++20 -O2 -shared -fPIC -Wall -Wextra -Werror reconstructed_dlls/bink/async_lifecycle.cpp -o build/lifecycle.so
          python tests/dlls/differential_bink_lifecycle.py originals/dlls/binkw64.dll build/lifecycle.so
